<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Facturas — {{TENANT_NAME}}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--brand:#2563EB;--ink:#111827;--muted:#6B7280;--rule:#E5E7EB;}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);margin:0;padding:0;background:#fff}
  .page{max-width:820px;margin:0 auto;padding:32px 24px}
  header{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:16px;margin-bottom:24px}
  .logo{width:56px;height:56px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain}
  header .who{flex:1}
  header .who .name{font-weight:800;font-size:18px}
  header .who .meta{color:var(--muted);font-size:12px}
  header .doc{text-align:right;color:var(--muted);font-size:12px;line-height:1.5}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .kpi{border:1px solid var(--rule);border-radius:10px;padding:14px;background:#FAFBFF}
  .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-weight:800;font-size:20px;margin-top:4px}
  h2{color:#1D4ED8;font-size:15px;margin:24px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
  th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left}
  th{background:var(--brand);color:#fff;font-weight:600}
  tr:nth-child(even){background:#F3F6FC}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .chartwrap{position:relative;height:300px;margin:12px 0}
  footer{margin-top:32px;padding-top:12px;border-top:1px solid var(--rule);color:var(--muted);font-size:11px;display:flex;justify-content:space-between}
  @media print{body{background:#fff}.page{padding:0}}
  @page{size:A4;margin:14mm}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="logo">{{LOGO_HTML}}</div>
  <div class="who">
    <div class="name">{{TENANT_NAME}}</div>
    <div class="meta">RFC {{TENANT_RFC}}</div>
  </div>
  <div class="doc">Generado: {{GENERATED}}<br>B&amp;B AI · Reportes</div>
</header>
<h1 id="rtitle">Reporte de Facturas</h1>
<div class="sub" id="rsub"></div>
<div class="kpis" id="kpis"></div>
<div id="sections"></div>
<footer><span>Generado por B&amp;B AI</span></footer>
</div>
<script>
const DATA = {{DATA}};
const MXN = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2});
const fmtMXN = v => MXN.format(Number(v)||0);
const fmtFecha = s => { if(!s) return '—'; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[3]+'/'+m[2]+'/'+m[1]; return String(s); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('rsub').textContent = DATA.subtitle||'';
const kpis = DATA.kpis||[];
const kpiBox = document.getElementById('kpis');
if(kpis.length){ kpiBox.innerHTML = kpis.map(k=>'<div class="kpi"><div class="l">'+esc(k.label)+'</div><div class="v">'+k.value+'</div></div>').join(''); }
const sec = document.getElementById('sections');
let out='';
if(DATA.summary && Object.keys(DATA.summary).length){
  out += '<h2>Resumen</h2><table><thead><tr><th>Campo</th><th>Valor</th></tr></thead><tbody>'
    + Object.entries(DATA.summary).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('')
    + '</tbody></table>';
}
if(DATA.table && DATA.table.headers){
  const th = DATA.table.headers, rows = DATA.table.rows||[];
  out += '<h2>Detalle</h2><table><thead><tr>'+th.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'
    + rows.map(r=>'<tr>'+r.map((c,i)=>'<td class="'+((DATA.table.numCols||[]).indexOf(i)>=0?'num':'')+'">'+esc(c)+'</td>').join('')+'</tr>').join('')
    + '</tbody></table>';
}
if(DATA.chart){
  out += '<h2>'+esc(DATA.chart.title||'Gráfica')+'</h2><div class="chartwrap"><canvas id="ch"></canvas></div>';
}
sec.innerHTML = out;
if(DATA.chart){
  const ch = DATA.chart, ctx = document.getElementById('ch');
  const palette=['#2563EB','#10B981','#F59E0B','#EF4444','#8B5CF6','#06B6D4','#F97316','#EC4899','#84CC16','#6366F1'];
  new Chart(ctx, {
    type: ch.type||'bar',
    data: { labels: ch.labels||[], datasets: [{ label: ch.label||'Monto', data: ch.values||[], backgroundColor: palette, borderColor: palette, borderWidth:1 }] },
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display: (ch.type==='pie'||ch.type==='doughnut') },
        tooltip:{ callbacks:{ label: function(c){ return ' '+c.label+': '+fmtMXN(c.parsed); } } } },
      scales: (ch.type==='bar')?{ y:{ beginAtZero:true, ticks:{ callback:function(v){ return '$'+Number(v).toLocaleString('es-MX'); } } } }:{}
    }
  });
}
</script>
</body>
</html>
