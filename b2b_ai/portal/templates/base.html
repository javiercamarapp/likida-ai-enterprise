<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Portal del cliente · B&amp;B AI{% endblock %}</title>
<style>
  :root{
    --blue:#2563EB; --blue-dark:#1D4ED8; --bg:#F4F6FB; --card:#FFFFFF;
    --ink:#111827; --muted:#6B7280; --line:#E5E7EB; --green:#059669;
    --red:#DC2626; --amber:#D97706;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
       Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);
       display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:240px;background:#0F172A;color:#E2E8F0;flex:0 0 240px;
        display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .brand{padding:20px 20px 16px;font-size:17px;font-weight:700;
               color:#fff;border-bottom:1px solid #1E293B}
  .side .brand span{color:#60A5FA}
  .side nav{flex:1;padding:12px 8px}
  .side nav a{display:block;padding:10px 14px;margin:2px 0;border-radius:8px;
              color:#CBD5E1;text-decoration:none;font-size:14px}
  .side nav a:hover{background:#1E293B;color:#fff}
  .side nav a.active{background:var(--blue);color:#fff;font-weight:600}
  .side .foot{padding:14px 20px;font-size:12px;color:#94A3B8;
              border-top:1px solid #1E293B}
  .side .foot a{color:#60A5FA;text-decoration:none}
  /* Main */
  .main{flex:1;padding:28px 36px;max-width:1180px;margin:0 auto;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;
          margin-bottom:22px}
  .topbar h1{font-size:22px;margin:0;font-weight:700}
  .topbar .who{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:20px;margin-bottom:20px}
  .card h2{margin:0 0 14px;font-size:16px}
  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
         gap:16px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:18px}
  .stat .k{font-size:13px;color:var(--muted);margin-bottom:8px}
  .stat .v{font-size:24px;font-weight:700}
  .stat .v.green{color:var(--green)} .stat .v.red{color:var(--red)}
  .stat .v.amber{color:var(--amber)} .stat .v.blue{color:var(--blue)}
  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);
        vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
     letter-spacing:.02em}
  tr:hover td{background:#F9FAFB}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;
         font-weight:600}
  .b-valida{background:#D1FAE5;color:#065F46}
  .b-anomalia{background:#FEF3C7;color:#92400E}
  .b-invalida{background:#FEE2E2;color:#991B1B}
  .b-procesado{background:#DBEAFE;color:#1E40AF}
  .b-pendiente{background:#EDE9FE;color:#5B21B6}
  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
  .filters input,.filters select{padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
  .btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid
       var(--line);background:#fff;color:var(--ink);text-decoration:none;
       font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-dark);color:#fff}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:26px}
  .flash{padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
  .flash.ok{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}
  /* Toast de notificaciones */
  #toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;
          flex-direction:column;gap:8px;max-width:340px}
  .toast{background:#0F172A;color:#E2E8F0;border-radius:10px;padding:11px 14px;
         font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;
         transform:translateY(8px);transition:all .25s ease}
  .toast.show{opacity:1;transform:none}
  .toast b{color:#93C5FD}
  .toast .x{float:right;cursor:pointer;color:#94A3B8;margin-left:8px}
  a.link{color:var(--blue);text-decoration:none}
  a.link:hover{text-decoration:underline}
  dl.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 24px;margin:0}
  dl.grid dt{color:var(--muted);font-size:12px;text-transform:uppercase;
             letter-spacing:.02em;margin-bottom:2px}
  dl.grid dd{margin:0;font-size:14px}
  @media (max-width:760px){ .side{display:none} .main{padding:16px}
    dl.grid{grid-template-columns:1fr} }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if user %}
<aside class="side">
  <div class="brand">B&amp;B <span>AI</span> Portal</div>
  <nav>
    <a href="/portal/dashboard" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>
    <a href="/portal/invoices" class="{{ 'active' if active=='invoices' }}">Facturas</a>
    <a href="/portal/reports" class="{{ 'active' if active=='reports' }}">Reportes</a>
    <a href="/portal/settings" class="{{ 'active' if active=='settings' }}">Configuración</a>
  </nav>
  <div class="foot">
    {{ user.user.name or user.user.email }}<br>
    <a href="/portal/logout">Cerrar sesión</a>
  </div>
</aside>
{% endif %}
<div class="main">
  {% block body %}{% endblock %}
</div>
{% if user %}
<div id="toasts"></div>
<script>
(function(){
  // Notificaciones en tiempo real vía SSE (EventSource envía la cookie sola).
  var toastBox = document.getElementById("toasts");
  function showToast(n){
    var t=document.createElement("div"); t.className="toast";
    t.innerHTML='<span class="x">&times;</span><div><b>'+
      (n.subject||"Notificación")+'</b></div><div>'+ (n.body||"") +'</div>';
    toastBox.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("show"); });
    t.querySelector(".x").onclick=function(){ t.remove(); };
    setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){t.remove();},300); }, 7000);
  }
  try{
    var es=new EventSource("/portal/notifications/stream");
    es.addEventListener("notification",function(e){
      try{ showToast(JSON.parse(e.data)); }catch(_){}
    });
    es.onerror=function(){ /* reconnect automático */ };
  }catch(e){}
})();
</script>
{% endif %}
</body>
</html>
