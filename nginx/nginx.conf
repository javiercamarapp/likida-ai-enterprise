# =============================================================================
# Nginx — reverse proxy para B&B AI (producción).
#
# Sirve el API FastAPI (upstream `b2b_api` = servicio `api:8000`), aplica
# rate limiting por IP, compresión gzip y termina TLS cuando hay certificados
# en ./nginx/certs/.
#
# El bloque HTTP (listen 80) está ACTIVO por defecto y sirve todo el tráfico:
# así el stack arranca y pasa el healthcheck sin depender de certs.
#
# Para habilitar TLS (producción con dominio):
#   1. Provisiona certificados (p.ej. Let's Encrypt / certbot) y colócalos en
#      ./nginx/certs/fullchain.pem y ./nginx/certs/privkey.pem
#   2. Descomenta el bloque `server { listen 443 ssl; ... }` de abajo
#   3. Opcional: activa el redirect HTTP->HTTPS en el bloque de abajo
#   4. Recrea el contenedor:  docker compose up -d nginx
# =============================================================================

# Zona de rate limiting: por IP, 10M de slots, 30 req/s base.
limit_req_zone $binary_remote_addr zone=b2b_limit:10m rate=30r/s;

# Compression gzip para contenido textual.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript
           application/xml image/svg+xml;
gzip_vary on;

upstream b2b_api {
    server api:8000;
    keepalive 32;
}

# ---- HTTP (activo por defecto): reverse proxy + rate limiting + gzip -----
server {
    listen 80;
    server_name _;

    # Límite del body: subida de CFDI XML (multipart).
    client_max_body_size 25m;

    # Cabeceras de cliente real detrás del proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck / métricas (sin buffering).
    location = /health {
        limit_req zone=b2b_limit burst=20 nodelay;
        proxy_pass http://b2b_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location = /metrics {
        limit_req zone=b2b_limit burst=20 nodelay;
        proxy_pass http://b2b_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Estáticos de la landing (js/css/imágenes) con cache, sin pasar por el API.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        limit_req zone=b2b_limit burst=60 nodelay;
        proxy_pass http://b2b_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
    }

    # Todo lo demás al API (landing HTML, /api/v1/*, /docs, etc.).
    location / {
        limit_req zone=b2b_limit burst=40 nodelay;
        proxy_pass http://b2b_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

