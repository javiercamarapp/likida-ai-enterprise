# =============================================================================
# Likida AI Enterprise — docker-compose.prod.yml · Stack de producción
#
# Servicios: postgres (DB real), api (FastAPI/uvicorn), nginx (reverse proxy).
#
# La app lee DATABASE_URL (DSN de PostgreSQL) y aplica las migraciones
# automáticamente en un hilo de fondo al arrancar, así que NO hay paso manual
# de migración: levanta el stack y el esquema queda al head por sí solo.
#
# Uso:
#   cp .env.example .env.production && vi .env.production   # rellena secretos
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   curl http://<IP>/health      # → {"status":"ok", ...}
#
# Nginx sirve el tráfico en :80/:443 y hace de reverse proxy hacia el API.
# =============================================================================

name: b2b-ai-prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: b2b-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b2b_ai}
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - b2b
    # No se expone al host; solo accesible desde la red interna del stack.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2b_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: b2b-ai:1.0.0
    container_name: b2b-ai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # Conexión a PostgreSQL 15 (la app hace failover dev→prod vía DATABASE_URL).
      DATABASE_URL: postgresql://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:-b2b_ai}
      B2B_ENV: production
      B2B_WORKERS: ${B2B_WORKERS:-2}
      # Nginx confía en este proxy y la app valida la IP real detrás de él.
      B2B_TRUST_PROXY: "true"
      # Redis es OPCIONAL: sin B2B_REDIS_URL el rate limiter usa memoria.
      # B2B_REDIS_URL: redis://redis:6379/0
    # No exponer puerto al host: solo Nginx habla con el API.
    expose:
      - "8000"
    networks:
      - b2b
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: b2b-ai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados TLS (Let's Encrypt). Crear el dir con el cert o dejar
      # comentado para servir solo HTTP. Ver DEPLOY.md → TLS.
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - b2b

networks:
  b2b:
    driver: bridge

volumes:
  postgres-data: # datos de PostgreSQL 15
