# =============================================================================
# railway.toml — Configuración de Railway para Likida AI Enterprise
# =============================================================================
# Railway auto-detecta este archivo en la raíz del repo.
# Railway CLI: railway up | railway variables set | railway logs
# Docs: https://docs.railway.com/reference/configuration
#
# REQUISITO previo (una vez): crear el plugin PostgreSQL desde el dashboard o:
#   railway add --plugin postgresql
# Ese add-on inyecta automáticamente la variable DATABASE_URL que la app lee
# para conectar a PostgreSQL (ver b2b_ai/api/app.py). No la configures a mano.
# =============================================================================

[build]
# Usar Dockerfile multi-stage (más optimizado que Nixpacks para Python)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Puerto dinámico (Railway asigna un PORT aleatorio que uvicorn debe escuchar)
startCommand = "sh -c 'uvicorn b2b_ai.api.app:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${B2B_WORKERS:-1} --proxy-headers'"

# Health check (Railway lo llama para verificar que el servicio está vivo)
healthcheckPath = "/health"
healthcheckTimeout = 30
healthcheckInterval = 15
healthcheckStartPeriod = 60

# Política de reinicio en caso de fallo
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Nº de réplicas (escala con un clic desde el dashboard)
numReplicas = 1
