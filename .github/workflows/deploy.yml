name: Deploy Likida AI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt
          pip install pytest pytest-asyncio httpx 'psycopg[binary]' psycopg-pool reportlab playwright
          pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest -q
      - name: Security lint (bandit)
        run: |
          pip install bandit
          bandit -r b2b_ai/ -ll --skip B101 || true
