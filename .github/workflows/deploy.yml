name: CI - Test Likida AI Enterprise
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt
          pip install pytest pytest-asyncio httpx 'psycopg[binary]' psycopg-pool reportlab playwright bandit
          pip install -e .

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Recopilar tests (sin bloqueos de import)
        run: |
          python -m compileall -q b2b_ai/
          python -c "import b2b_ai.features.diot; import b2b_ai.api.app; print('imports OK')"

      - name: Ejecutar suite de tests
        run: pytest -q -m "not computer_use_e2e" --ignore=tests/test_computer_use_e2e.py
        env:
          B2B_ENV: development

      - name: Ejecutar E2E Computer Use (Chromium real)
        run: pytest -q tests/test_computer_use_e2e.py
        env:
          B2B_ENV: development

      - name: Security lint (bandit)
        run: bandit -r b2b_ai/ -ll --skip B101 || true
