name: Deploy B&B AI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Tests (must pass before deploy) ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --co -q 2>/dev/null || true
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests failed"

      - name: Security lint (bandit)
        run: |
          pip install bandit 2>/dev/null && bandit -r b2b_ai/ -ll --skip B101 || true

  # ── Landing → Vercel ──
  deploy-landing:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./landing

  # ── API → Railway ──
  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        run: railway up --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
