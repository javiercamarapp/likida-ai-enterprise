name: CI - Test Likida AI Enterprise
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      B2B_ENV: testing
      B2B_JWT_SECRET: ci-only-ephemeral-secret-not-for-production-0001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt
          pip install pytest pytest-timeout pytest-asyncio httpx 'psycopg[binary]' psycopg-pool reportlab playwright bandit
          pip install -e .

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Recopilar tests (sin bloqueos de import)
        run: |
          python -m compileall -q b2b_ai/
          python -c "import b2b_ai.features.diot; import b2b_ai.api.app; print('imports OK')"

      - name: Ejecutar suite de tests
        # --timeout mata tests colgados (init pesado de app.py); -x no; corre todo
        run: pytest -q --timeout=120 -m "not computer_use_e2e" --ignore=tests/test_computer_use_e2e.py

      - name: Ejecutar E2E Computer Use (Chromium real)
        run: pytest -q --timeout=180 tests/test_computer_use_e2e.py

      - name: Security lint (bandit)
        # Bloquea hallazgos HIGH; la deuda MEDIUM se sigue auditando.
        run: bandit -r b2b_ai/ -lll --skip B101
