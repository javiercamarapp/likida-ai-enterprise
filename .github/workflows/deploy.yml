name: Deploy B&B AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Puerta: la suite corre ANTES de cualquier despliegue ──
  #
  # Antes este workflow tenía solo los dos jobs de despliegue y ninguno instalaba
  # dependencias ni ejecutaba pytest: cada push a `main` iba directo a Vercel y a
  # Railway. En el momento de la auditoría eso significaba desplegar con ocho
  # pruebas en rojo, dos de las cuales señalaban una fuga entre tenants en el
  # audit log y una conciliación bancaria inservible con más de un worker.
  #
  # Corre también en `pull_request`: es donde hay que enterarse, no después de
  # mergear.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Las dependencias FIJADAS de producción, y no las abiertas de
      # pyproject.toml: la suite tiene que correr contra las mismas versiones que
      # se despliegan. La diferencia importa —con `lxml>=4.9` el parser de CFDI
      # resolvería entidades externas, y con la 6.1.1 fijada no—.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt
          pip install pytest httpx 'psycopg[binary]' psycopg-pool
          pip install -e .

      - name: Pruebas
        run: pytest -q

      # Bandit, heredado del workflow anterior. Se conserva como informativo
      # (`|| true`) a propósito: hoy marca falsos positivos —los f-string de
      # `LIMIT {int(limit)}` y el `UPDATE ... SET {sets}` con allowlist fija—,
      # así que bloquear con él solo enseñaría a ignorarlo. Convertirlo en
      # puerta exige antes anotar esos casos con `# nosec` y su porqué.
      - name: Lint de seguridad (bandit, informativo)
        run: |
          pip install bandit
          bandit -r b2b_ai/ -ll --skip B101 || true

  # ── Landing → Vercel ──
  deploy-landing:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./landing

  # ── API → Railway ──
  deploy-api:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        run: railway up --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
