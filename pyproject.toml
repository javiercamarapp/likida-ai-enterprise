[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-ai"
version = "1.0.0"
description = "Agente IA enterprise para despachos contables (Likida AI Enterprise). Tool calling, ERP (CONTPAQi mock), facturación CFDI, multi-tenant, API dashboard y CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "lxml>=4.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "bcrypt>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "cryptography>=42.0",
    "signxml>=3.2",
    "defusedxml>=0.7",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.scripts]
bb-ai = "b2b_ai.cli:main"

[tool.setuptools.packages.find]
include = ["b2b_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "computer_use_e2e: End-to-end Computer Use tests that launch real Chromium via Playwright. These require the Playwright browsers installed (playwright install chromium).",
    "e2e: End-to-end tests that require live external services.",
]
# Los E2E de Computer Use (Chromium real) se excluyen del CI estándar salvo que
# PLAYWRIGHT_BROWSERS esté disponible; se ejecutan explícitamente.
addopts = "--strict-markers"
