[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-ai"
version = "1.0.0"
description = "Agente IA enterprise para despachos contables (Likida AI Enterprise). Tool calling, ERP (CONTPAQi mock), facturación CFDI, multi-tenant, API dashboard y CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "lxml>=4.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "starlette>=0.27",
    "bcrypt>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "cryptography>=42.0",
    "signxml>=3.2",
    "defusedxml>=0.7",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
    "sentry-sdk>=1.40",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21", "httpx>=0.24"]
erp = ["pymssql>=2.2", "pyodbc>=5.0"]
ml = ["scikit-learn>=1.3", "pandas>=2.0", "numpy>=1.24"]
payments = ["stripe>=7.0"]
integrations = ["boto3>=1.34", "twilio>=9.0", "sendgrid>=6.11", "zeep>=4.2"]
llm = ["openai>=1.10", "anthropic>=0.40"]
browser = ["playwright>=1.40"]

[project.scripts]
bb-ai = "b2b_ai.cli:main"

[tool.setuptools.packages.find]
include = ["b2b_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
